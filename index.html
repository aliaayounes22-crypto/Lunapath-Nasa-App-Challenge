<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/lunapath-logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaPath – Moon Landing Planner | NASA Space Apps Challenge 2026</title>
    <meta name="description" content="LunaPath: Interactive mission-planning dashboard evaluating candidate lunar South Pole landing sites based on published illumination and Earth visibility research by Wueller et al. (2026)." />
    <meta name="keywords" content="LunaPath, Moon Landing Planner, NASA Space Apps Challenge 2026, Artemis, Lunar South Pole, Shackleton, Haworth, Nobile Rim, Slater Plain, Illumination, Earth Visibility" />
    <meta name="theme-color" content="#050816" />

    <!-- Open Graph (OG) / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LunaPath – Moon Landing Planner | NASA Space Apps 2026" />
    <meta property="og:description" content="Interactive mission-planning dashboard evaluating candidate lunar South Pole landing sites based on peer-reviewed research by Wueller et al. (2026)." />
    <meta property="og:image" content="/lunapath-logo.png" />
    <meta property="og:url" content="https://lunapath.space" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LunaPath – Moon Landing Planner" />
    <meta name="twitter:description" content="Interactive lunar South Pole landing site exploration grounded in peer-reviewed scientific data." />
    <meta name="twitter:image" content="/lunapath-logo.png" />

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      body {
        margin: 0;
        background-color: #050816;
        color: #F5F7FA;
      }
    </style>
  </head>
  <body class="bg-[#050816] text-[#F5F7FA] antialiased">
    <div id="root">
      <!-- Fallback shown only when double-clicked directly from Windows File Explorer (file:// protocol) -->
      <div id="file-protocol-helper" style="display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #050816; color: #F5F7FA; font-family: 'Space Grotesk', system-ui, sans-serif;">
        <div style="max-width: 520px; width: 100%; background: rgba(10, 20, 40, 0.95); border: 1px solid rgba(212, 161, 30, 0.4); border-radius: 20px; padding: 36px 24px; box-shadow: 0 0 50px rgba(252, 61, 33, 0.25); box-sizing: border-box;">
          <div style="width: 64px; height: 64px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
            <img src="/lunapath-logo.png" alt="LunaPath Logo" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <h1 style="margin: 0 0 6px; font-size: 26px; font-weight: 800; color: #FFFFFF; font-family: 'Orbitron', sans-serif;">
            Luna<span style="color: #FC3D21;">Path</span> Mission Control
          </h1>
          <p style="margin: 0 0 20px; font-size: 13px; color: #D4A11E; font-family: monospace;">
            NASA Space Apps Challenge 2026 • Moon Landing Planner
          </p>
          <div style="background: rgba(5, 8, 22, 0.85); border: 1px solid rgba(245, 247, 250, 0.1); border-radius: 12px; padding: 14px; margin-bottom: 22px; font-size: 13px; line-height: 1.5; color: #A8B0C0;">
            Redirecting you automatically to the local mission server...
          </div>
          <a id="launch-btn" href="http://localhost:5173/" style="display: inline-block; background: #FC3D21; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 12px 28px; border-radius: 12px; text-decoration: none; box-shadow: 0 0 25px rgba(252, 61, 33, 0.5); text-transform: uppercase; letter-spacing: 0.05em;">
            Open Mission Control (localhost:5173)
          </a>
          <p style="margin: 20px 0 0; font-size: 12px; color: #64748B;">
            If the server is not started, double-click <strong style="color: #F5F7FA;">START_LUNAPATH.bat</strong> in your project folder.
          </p>
        </div>
      </div>
    </div>

    <script>
      // When opened as file:// (double-clicked from Windows File Explorer)
      if (window.location.protocol === 'file:') {
        var helper = document.getElementById('file-protocol-helper');
        if (helper) helper.style.display = 'flex';
        // Auto-redirect to local dev server
        setTimeout(function () {
          window.location.href = 'http://localhost:5173/';
        }, 300);
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
